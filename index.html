<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="in quest to learn backend,inhence Dom manipulation i made this ride booking site" />
<title>BodaCareRides</title>
<link rel="stylesheet" href="style.css" title="" type="" />
</head>

<body>

<div class="screen">
<p class="welcome">
hello welcome to bodacare services
</p>
<p class="info"></p>
</div>
<form action="e" method="get" accept-charset="utf-8">
<label for="fromTowns" aria-placeholder="enter town you are now">From:</label>
<input list="fromTowns" name="towns" id="select" value="" placeholder="choose town you are now" />
<datalist id="fromTowns">
<option value="Westlands Sacco">
<option value="Ngong Road Sacco">
<option value="No Sacco">
<option value="Karen Riders">
<option value="Eastleigh Boda">
<option value="CBD Riders">
</datalist>
<label for="toTowns">To:</label>
<input list="toTowns" name="" id="select2" value="" placeholder="choose town you are going" />
<datalist id="toTowns">
<option value="CBD Riders">
<option value="Karen Riders">
<option value="Eastleigh Boda">
<option value="No Sacco">
<option value="Ngong Road Sacco">
<option value="Westlands Sacco">
</datalist>
<button class="submit" type="submit" title="submit to get price">Get Price</button>
</form>
<p id="errorCode"></p>
<script type="text/javascript" charset="utf-8" src="script.js">

</script>
</body>

</html>
